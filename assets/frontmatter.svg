<!-- 
# Modified by Gemini CLI on 2026-05-10 for Heiko Schlittermann (HS12-RIPE) <hs@schlittermann.de>
# Rationale: Rework the SVG graphic to match the schlittermann.de theme (red/grey/white) and make it "fancier".
-->
<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d60029;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a3001f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="1" dy="1" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="2" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>

  <style>
    .title { font: bold 48px Arial, Helvetica, sans-serif; fill: url(#headerGradient); filter: url(#shadow); }
    .subtitle { font: italic 22px Georgia, serif; fill: #3f3f3f; }
    .feature { font: 16px Arial, Helvetica, sans-serif; fill: #3f3f3f; font-weight: bold; }
    .icon { fill: #d60029; }
    .domain { font: bold 14px Arial, Helvetica, sans-serif; fill: #666; opacity: 0.7; }
    .bg { fill: #FFFFFF; }
    .accent-bar { fill: #d60029; }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="5" class="accent-bar" />

  <!-- North East Corner -->
  <text x="790" y="25" class="domain" text-anchor="end">schlittermann.de</text>

  <text x="50" y="70" class="title">cert-proxy</text>
  <text x="50" y="105" class="subtitle">Secure Certificate Distribution for Linux Professionals</text>

  <g transform="translate(50, 150)">
    <path class="icon" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
    <text x="35" y="18" class="feature">Enterprise Grade Security</text>
  </g>

  <g transform="translate(320, 150)">
    <path class="icon" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-2v-2h2v2zm0-4h-2V7h2v6z" />
    <text x="35" y="18" class="feature">Centralized Management</text>
  </g>

  <g transform="translate(590, 150)">
    <path class="icon" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z" />
    <text x="35" y="18" class="feature">Automated Workflow</text>
  </g>
</svg>
