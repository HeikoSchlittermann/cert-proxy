<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f6f6" />
    </linearGradient>
    <linearGradient id="cardinalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b00020" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d60029" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="12" stroke="#e0e0e0" stroke-width="2" />
  <text x="780" y="30" fill="#d60029" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end">schlittermann.de</text>

  <!-- Title -->
  <text x="400" y="50" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Secure Certificate Vault</text>
  <text x="400" y="75" fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Strict mutual TLS (mTLS) authorization per domain</text>

  <!-- Left: Vault (cert-proxy-server) -->
  <g transform="translate(150, 120)">
    <rect x="0" y="0" width="180" height="200" fill="#fff" stroke="#1a1a1a" stroke-width="4" rx="10" />
    <circle cx="90" cy="100" r="50" fill="none" stroke="#d60029" stroke-width="6" filter="url(#glow)"/>
    <circle cx="90" cy="100" r="10" fill="#d60029"/>
    <!-- Keyhole -->
    <path d="M 85 105 L 95 105 L 98 120 L 82 120 Z" fill="#d60029"/>
    
    <text x="90" y="235" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">cert-proxy</text>
    <text x="90" y="255" fill="#d60029" font-family="monospace" font-size="14" text-anchor="middle">Central Server</text>
  </g>

  <!-- Connections -->
  <!-- Auth 1: Granted -->
  <path d="M 330 160 L 520 160" stroke="url(#cardinalGlow)" stroke-width="4" />
  <circle cx="425" cy="160" r="15" fill="#fff" stroke="#d60029" stroke-width="2"/>
  <text x="425" y="165" fill="#d60029" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✓</text>
  <text x="425" y="140" fill="#d60029" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">mTLS AuthZ</text>

  <!-- Auth 2: Denied -->
  <path d="M 330 260 L 520 260" stroke="#999" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="425" cy="260" r="15" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="425" y="265" fill="#999" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✗</text>

  <!-- Right: Clients -->
  <g transform="translate(520, 120)">
    <!-- Client 1 -->
    <rect x="0" y="0" width="140" height="80" fill="#fff" stroke="#d60029" stroke-width="2" rx="6"/>
    <text x="70" y="30" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Web Server</text>
    <text x="70" y="50" fill="#666" font-family="monospace" font-size="12" text-anchor="middle">Valid Client Cert</text>
    <rect x="50" y="60" width="40" height="10" fill="#d60029" rx="2"/>

    <!-- Client 2 -->
    <rect x="0" y="100" width="140" height="80" fill="#f9f9f9" stroke="#ccc" stroke-width="2" rx="6"/>
    <text x="70" y="130" fill="#999" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Untrusted Node</text>
    <text x="70" y="150" fill="#999" font-family="monospace" font-size="12" text-anchor="middle">No Access</text>
  </g>
</svg>
