<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="cert-proxy — mutual-TLS certificate distribution">
  <style>
    svg{--fg:#1f1f1f;--muted:#7a7a7a;--dim:#a8a8a8;--accent:#d60029;--hair:#bdbdbd}
    @media (prefers-color-scheme: dark){
      svg{--fg:#ececec;--muted:#9a9a9a;--dim:#5e5e5e;--accent:#ff3354;--hair:#3a3a3a}
    }
    .fg{fill:var(--fg)} .muted{fill:var(--muted)} .dim{fill:var(--dim)} .accent{fill:var(--accent)}
    .s-fg{stroke:var(--fg);fill:none} .s-muted{stroke:var(--muted);fill:none}
    .s-accent{stroke:var(--accent);fill:none} .s-hair{stroke:var(--hair);fill:none}
    .mono{font-family:ui-monospace,"JetBrains Mono","SF Mono","IBM Plex Mono",Menlo,Consolas,monospace}
    .man{font-size:11px;letter-spacing:0.22em;font-weight:600}
    .word{font-size:56px;font-weight:600;letter-spacing:-0.04em}
    .tag{font-size:14px;letter-spacing:0.04em}
    .meta{font-size:10px;letter-spacing:0.18em}
  </style>

  <!-- man-page header rule -->
  <text x="40"  y="28" class="mono man muted">CERT-PROXY(1)</text>
  <text x="400" y="28" class="mono man dim" text-anchor="middle">CERTIFICATE DISTRIBUTION</text>
  <text x="760" y="28" class="mono man muted" text-anchor="end">CERT-PROXY(1)</text>
  <line x1="40" y1="40" x2="760" y2="40" class="s-hair" stroke-width="1"/>

  <!-- signature mark: padlock with certificate inside -->
  <g transform="translate(56,76)" stroke-linecap="round" stroke-linejoin="round">
    <!-- shackle -->
    <path d="M16 22 v-9 a14 14 0 0 1 28 0 v9" class="s-fg" stroke-width="1.5" fill="none"/>
    <!-- lock body -->
    <rect x="2" y="22" width="56" height="50" rx="3" class="s-fg" stroke-width="1.5"/>
    <!-- cert lines inside -->
    <line x1="12" y1="36" x2="48" y2="36" class="s-muted" stroke-width="1"/>
    <line x1="12" y1="44" x2="40" y2="44" class="s-muted" stroke-width="1"/>
    <line x1="12" y1="52" x2="48" y2="52" class="s-muted" stroke-width="1"/>
    <!-- seal -->
    <circle cx="44" cy="62" r="4.5" class="s-accent" stroke-width="1.25"/>
    <circle cx="44" cy="62" r="1.5" class="accent"/>
  </g>

  <!-- wordmark -->
  <text x="140" y="118" class="mono word fg">cert<tspan class="accent" dx="2" dy="-2" font-size="42">→</tspan><tspan dx="2" dy="2" class="fg">proxy</tspan></text>

  <!-- tagline -->
  <text x="140" y="148" class="mono tag muted">mutual-tls certificate distribution · let's encrypt at the edge</text>

  <!-- footer rule -->
  <line x1="40" y1="172" x2="760" y2="172" class="s-hair" stroke-width="1"/>
  <text x="40"  y="190" class="mono meta muted">NAME</text>
  <text x="120" y="190" class="mono meta dim">cert-proxy — distribute X.509 certs over mTLS</text>
  <text x="760" y="190" class="mono meta muted" text-anchor="end">schlittermann.de</text>
</svg>
