<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="cert-proxy hub: one ACME, many endpoints">
  <style>
    svg{--fg:#1f1f1f;--muted:#7a7a7a;--dim:#a8a8a8;--accent:#d60029;--hair:#bdbdbd}
    @media (prefers-color-scheme: dark){
      svg{--fg:#ececec;--muted:#9a9a9a;--dim:#5e5e5e;--accent:#ff3354;--hair:#3a3a3a}
    }
    .fg{fill:var(--fg)} .muted{fill:var(--muted)} .dim{fill:var(--dim)} .accent{fill:var(--accent)}
    .s-fg{stroke:var(--fg);fill:none} .s-muted{stroke:var(--muted);fill:none}
    .s-accent{stroke:var(--accent);fill:none} .s-hair{stroke:var(--hair);fill:none}
    .mono{font-family:ui-monospace,"JetBrains Mono","SF Mono","IBM Plex Mono",Menlo,Consolas,monospace}
    .man{font-size:11px;letter-spacing:0.22em;font-weight:600}
    .label{font-size:14px;font-weight:600}
    .sub{font-size:11px;letter-spacing:0.05em}
    .tag{font-size:10px;letter-spacing:0.16em;font-weight:600}
  </style>

  <!-- header -->
  <text x="40"  y="28" class="mono man muted">CERT-PROXY(1)</text>
  <text x="400" y="28" class="mono man dim" text-anchor="middle">HUB · ONE ACME, MANY ENDPOINTS</text>
  <text x="760" y="28" class="mono man muted" text-anchor="end">CERT-PROXY(1)</text>
  <line x1="40" y1="40" x2="760" y2="40" class="s-hair"/>

  <!-- acme source -->
  <g transform="translate(40,156)">
    <rect x="0" y="0" width="140" height="64" rx="2" class="s-fg" stroke-width="1.25"/>
    <text x="12" y="26" class="mono label fg">let's encrypt</text>
    <line x1="12" y1="36" x2="128" y2="36" class="s-hair"/>
    <text x="12" y="54" class="mono sub muted">acme client</text>
  </g>
  <line x1="180" y1="188" x2="300" y2="188" class="s-fg" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- hub: signature mark inside a ring -->
  <g transform="translate(380,188)">
    <circle r="74" class="s-fg" stroke-width="1.5"/>
    <circle r="58" class="s-accent" stroke-width="1" stroke-dasharray="1 3"/>
    <!-- signature lock mark, centered -->
    <g transform="translate(-30,-37)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 22 v-9 a14 14 0 0 1 28 0 v9" class="s-fg" stroke-width="1.5" fill="none"/>
      <rect x="2" y="22" width="56" height="50" rx="3" class="s-fg" stroke-width="1.5"/>
      <line x1="12" y1="36" x2="48" y2="36" class="s-muted" stroke-width="1"/>
      <line x1="12" y1="44" x2="40" y2="44" class="s-muted" stroke-width="1"/>
      <line x1="12" y1="52" x2="48" y2="52" class="s-muted" stroke-width="1"/>
      <circle cx="44" cy="62" r="4.5" class="s-accent" stroke-width="1.25"/>
      <circle cx="44" cy="62" r="1.5" class="accent"/>
    </g>
  </g>
  <text x="380" y="296" class="mono tag muted" text-anchor="middle">CERT-PROXY · VAULT</text>

  <!-- endpoints -->
  <g class="mono">
    <g transform="translate(580,82)">
      <rect x="0" y="0" width="180" height="50" rx="2" class="s-fg" stroke-width="1.25"/>
      <text x="14" y="22" class="label fg">web cluster</text>
      <text x="14" y="38" class="sub muted">web.example.com</text>
    </g>
    <g transform="translate(580,164)">
      <rect x="0" y="0" width="180" height="50" rx="2" class="s-fg" stroke-width="1.25"/>
      <text x="14" y="22" class="label fg">mail mta</text>
      <text x="14" y="38" class="sub muted">mail.example.com</text>
    </g>
    <g transform="translate(580,246)">
      <rect x="0" y="0" width="180" height="50" rx="2" class="s-fg" stroke-width="1.25"/>
      <text x="14" y="22" class="label fg">database</text>
      <text x="14" y="38" class="sub muted">db.internal</text>
    </g>
  </g>

  <!-- spokes -->
  <g class="s-accent" stroke-width="1.25">
    <path d="M454 188 C 510 130, 530 116, 578 107"/>
    <path d="M454 188 C 510 188, 530 188, 578 189"/>
    <path d="M454 188 C 510 246, 530 260, 578 271"/>
  </g>
  <g class="accent">
    <circle cx="578" cy="107" r="2.2"/>
    <circle cx="578" cy="189" r="2.2"/>
    <circle cx="578" cy="271" r="2.2"/>
  </g>

  <line x1="40" y1="310" x2="760" y2="310" class="s-hair"/>
  <text x="40"  y="328" class="mono sub muted">renew once · distribute everywhere · per-domain authz</text>
  <text x="760" y="328" class="mono sub dim" text-anchor="end">schlittermann.de</text>
</svg>
