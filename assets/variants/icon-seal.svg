<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="cert-proxy icon — red-seal variant">
  <style>
    .fg     { stroke: #1f1f1f; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .muted  { stroke: #7a7a7a; fill: none; stroke-linecap: round; }
    .accent { stroke: #d60029; fill: none; }
    .accent-fill { fill: #d60029; }
    @media (prefers-color-scheme: dark) {
      .fg     { stroke: #ececec; }
      .muted  { stroke: #9a9a9a; }
      .accent { stroke: #ff3354; }
      .accent-fill { fill: #ff3354; }
    }
  </style>

  <g transform="translate(54,40)">
    <!-- shackle -->
    <path d="M30 56 v-22 a44 44 0 0 1 88 0 v22" class="fg" stroke-width="9"/>
    <!-- lock body -->
    <rect x="0" y="56" width="148" height="132" rx="10" class="fg" stroke-width="9"/>
    <!-- cert text-lines -->
    <line x1="24" y1="92"  x2="124" y2="92"  class="muted" stroke-width="6"/>
    <line x1="24" y1="114" x2="100" y2="114" class="muted" stroke-width="6"/>
    <line x1="24" y1="136" x2="124" y2="136" class="muted" stroke-width="6"/>
    <!-- wax seal -->
    <circle cx="112" cy="164" r="14" class="accent" stroke-width="6"/>
    <circle cx="112" cy="164" r="5"  class="accent-fill"/>
  </g>
</svg>
