# Demo vhost: HTTPS using the cert-proxy-delivered elbtal.com certificate.
# (co)authored by ai:claude-opus-4-6
server {
    listen 443 ssl;
    server_name elbtal.com;

    ssl_certificate     /var/lib/cert-proxy/certs/elbtal.com/fullchain.pem;
    ssl_certificate_key /var/lib/cert-proxy/certs/elbtal.com/privkey.pem;

    location / {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>elbtal.com</title><h1>cert-proxy demo</h1><p>Served by nginx over HTTPS using the Let&apos;s Encrypt certificate for <b>elbtal.com</b>, delivered by cert-proxy-client.</p>';
    }
}
