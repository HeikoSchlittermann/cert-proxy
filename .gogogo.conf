# Defaults are shown as commented keys, e.g. "#enabled: true".
# Uncomment and adjust only the settings you need.

# Config schema version.
version: 2

# Go module path. If unset, gogogo reads it from go.mod.
#module: ""

# Repository host used for cloning, release creation, and hosted package uploads.
repo:
  # Git remote used for auto-detecting apiurl, owner, name, and token.
  #remote: origin

  # Forgejo/Gitea API URL. If unset, gogogo derives
  # https://<remote-host>/api/v1 from repo.remote.
  #apiurl: ""

  # Repository owner/organization. If unset, derived from repo.remote.
  #owner: ""

  # Repository name. If unset, derived from repo.remote.
  #name: ""

  # API token. If unset, defaults to netrc:<remote-host> when repo.remote is known.
  #token: ""

security:
  # Redirect targets that may receive forwarded API request headers.
  # Entries are URL prefixes such as https://forgejo.example.com/.
  # If unset, redirects are followed without target restriction.
  #trusted_redirects: []

# Environment passed to Go/Git subprocesses.
#env: {}
env:
  CGO_ENABLED: 0

# Release workflow policy.
#release:
#  # Branch where release tags may be created. If unset, use repository default branch.
#  #branch: ""

# Build step: produces raw command binaries.
build:
  # Commands/packages to build. If unset, build the module root command.
  #commands: []
  commands:
    - cmd/cert-proxy-server
    - cmd/cert-proxy-client

  # GOOS/GOARCH targets. If unset, use the current host target.
  targets:
    - windows/amd64
    - linux/amd64
    - linux/arm64

  # Strip level for produced binaries (via go linker flags).
  # Valid: "all" (-s -w), "symbols" (-s), "dwarf" (-w), "none".
  #strip: all

  #test:
  #  # Skip tests before build.
  #  skip: false
  #
  #  # Test command/package override.
  #  run: ""
  #
  #  # Extra flags passed to go test.
  #  flags: []
  #
  #  # Extra positional args passed after go test flags.
  #  args: []

# Artifact step: decides which deliverables are created from build outputs.
artifacts:
  blob:
    # Raw build outputs are created by default.
    #enabled: true

    # Extra files to publish as blobs, relative to config/module root.
    #extra: []
    # Example:
    #extra:
    #  - src: README.md
    #    name: README.md

  deb:
    # Debian artifacts are disabled by default.
    enabled: true

    # Debian source artifacts (.dsc, tarball, .changes) are enabled by default.
    #source: true

    # Bundle Go dependencies into Debian source artifacts by default.
    #source_vendor: true

    #section: misc
    #priority: optional
    distributions:
      - stable
      - oldstable
    #component: main

    #depends: []
    #recommends: []
    #suggests: []
    #conflicts: []
    #replaces: []

    # Extra files included in the .deb package.
    #files: []
    # Example:
    #files:
    #  - src: packaging/mytool.service
    #    dst: /lib/systemd/system/mytool.service

    # Configuration files registered as dpkg conffiles.
    #conffiles: []

    # Auto-generate maintainer scripts for systemd/sysusers/tmpfiles assets.
    #systemd: true

    # Run lintian on generated .deb packages. Disable if your package has
    # known warnings you accept.
    #lintian: true

    # Explicit maintainer scripts. If any are set, auto-generation is disabled.
    #scripts:
    #  preinst: ""
    #  postinst: ""
    #  prerm: ""
    #  postrm: ""

  rpm:
    # RPM artifacts are disabled by default.
    #enabled: false

    # Source RPM artifacts are disabled by default.
    #source: false

    # Bundle Go dependencies into source RPM artifacts by default.
    #source_vendor: true

    #group: Applications/System
    #vendor: ""
    #repository: ""

    #requires: []
    #provides: []
    #obsoletes: []

  common:
    # Shared package metadata. Empty values are auto-detected where possible.
    #maintainer: ""
    #description: ""
    #homepage: ""
    #license: ""

  # Multi-package split. Three modes:
  #   absent           — all binaries combined into one package (default)
  #   "*"              — one package per cmd/* binary
  #   list of entries  — explicit per-package config (name, binaries, deb, rpm)
  #
  packages:
    - name: cert-proxy-client
      binaries: [cert-proxy-client]
      deb:
      #   depends: []
        description: The client side of the cert-proxy.
        systemd-units:
          - systemd/cert-proxy-client.service
          - systemd/cert-proxy-client.timer
        # Creates the ssl-cert group and /var/lib/cert-proxy/certs (0750
        # root:ssl-cert), replacing the dpkg-statoverride the pre-gogogo
        # packaging used to set up in postinst.
        sysusers:
          - systemd/cert-proxy-client.sysusers
        tmpfiles:
          - systemd/cert-proxy-client.tmpfiles
        files:
          - src: debian/cert-proxy-client.lintian-overrides
            dst: usr/share/lintian/overrides/cert-proxy-client
        conffiles:
          - src: systemd/cert-proxy-client.default
            dst: /etc/default/cert-proxy-client
          # Referenced as -hook/-shared-hook by cert-proxy-client.service.
          # A conffile, so local edits survive upgrades.
          - src: debian/hook.example
            dst: /etc/cert-proxy/hook

      # rpm:
      #   requires: []
    - name: cert-proxy-server
      binaries: [cert-proxy-server]
      deb:
      #   depends: []
        description: The server side of the cert-proxy.
        systemd-units:
          - systemd/cert-proxy-server.service
        files:
          - src: debian/cert-proxy-server.lintian-overrides
            dst: usr/share/lintian/overrides/cert-proxy-server
        conffiles:
          - src: systemd/cert-proxy-server.default
            dst: /etc/default/cert-proxy-server
          # Listed explicitly, not globbed: CA/lib/ also holds the
          # admin's own vars.sh (gitignored), and mkca creates the CA
          # itself under CA_DIR. A glob would package whatever happens to
          # be lying around at pack time.
          - src: CA/bin/mkssl-pem
            dst: /etc/cert-proxy/ca/bin/mkssl-pem
          - src: CA/lib/mkca
            dst: /etc/cert-proxy/ca/lib/mkca
          # Not an example: mkca installs this as the CA's openssl.cnf.
          - src: CA/lib/openssl.cnf
            dst: /etc/cert-proxy/ca/lib/openssl.cnf
          - src: CA/lib/vars.sh.example
            dst: /etc/cert-proxy/ca/lib/vars.sh.example
      # rpm:
      #   requires: []

# Publish step: routes artifact groups to named destinations.
publish:
  # Omitted or "releases" publishes blobs via the Forgejo release API. [] or "none" publishes nowhere.
  #blob: releases

  # Omitted or "packages" publishes Debian artifacts via the Forgejo packages API.
  deb: dupload

  # Omitted or "packages" publishes RPM artifacts via the Forgejo packages API.
  #rpm: packages

  # Destination names are aliases. Built-ins: releases, packages, dupload.
  # Override a built-in or add extra destinations here.
  #destinations:
  #  releases:
  #    type: forgejo-release
  #  packages:
  #    type: forgejo-packages
  #
  #  # Example extra Debian upload destination.
  #  debian_upload:
  #    type: dupload
  #
  #    # dupload host nickname. If unset, dupload uses its own default.
  #    #host: ""
  #
  #    # Durable upload workspace. If unset, use $HOME/.dupload-uploads/<package>.
  #    #dir: ""
  #
  #    # Optional extra dupload config file, passed as --configfile.
  #    #configfile: ""
  #
  #    # GPG key passed to debsign -k. If unset, use debsign default.
  #    #keyid: ""

# vim:set ft=yaml:
