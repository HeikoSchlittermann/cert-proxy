# Defaults and auto-detected values are commented out.
# Uncomment non-default settings you want to keep.

# Config schema version.
version: 2

# Go module path. If unset, gogogo reads it from go.mod.
#module: "go.schlittermann.de/heiko/cert-proxy"

# Repository host used for cloning, release creation, and hosted package uploads.
repo:
  # Git remote used for auto-detecting apiurl, owner, name, and token.
  #remote: origin

  # Forgejo/Gitea API URL. If unset, gogogo derives
  # https://<remote-host>/api/v1 from repo.remote.
  #apiurl: "https://git.schlittermann.de/api/v1"

  # Repository owner/organization. If unset, derived from repo.remote.
  #owner: "heiko"

  # Repository name. If unset, derived from repo.remote.
  #name: "cert-proxy"

  # API token. If unset, defaults to netrc:<remote-host> when repo.remote is known.
  #token: "netrc:git.schlittermann.de"

security:
  # Redirect targets that may receive forwarded API request headers.
  # Entries are URL prefixes such as https://forgejo.example.com/.
  # If unset, redirects are followed without target restriction.
  #trusted_redirects: []

# Environment passed to Go/Git subprocesses.
env:
  CGO_ENABLED: "0"

# Release workflow policy.
#release:
#  # Branch where release tags may be created. If unset, use repository default branch.
#  #branch: ""

# Build step: produces raw command binaries.
build:
  # Commands/packages to build. If unset, build the module root command.
  commands:
    - "cmd/cert-proxy-server"
    - "cmd/cert-proxy-client"

  # GOOS/GOARCH targets. If unset, use the current host target.
  targets:
    - "linux/amd64"
    - "linux/arm64"
    - "windows/amd64"

  # Strip level for produced binaries (via go linker flags).
  # Valid: "all" (-s -w), "symbols" (-s), "dwarf" (-w), "none".
  #strip: all

  #test:
  #  # Skip tests before build.
  #  skip: false
  #
  #  # Test command/package override.
  #  run: ""
  #
  #  # Extra flags passed to go test.
  #  flags: []
  #
  #  # Extra positional args passed after go test flags.
  #  args: []

# Artifact step: decides which deliverables are created from build outputs.
artifacts:
  blob:
    # Raw build outputs are created by default.
    #enabled: true

    # Extra files to publish as blobs, relative to config/module root.
    #extra: []
    # Example:
    #extra:
    #  - src: README.md
    #    name: README.md

  deb:
    # Debian artifacts are disabled by default.
    enabled: true

    # Debian source artifacts (.dsc, tarball, .changes) are enabled by default.
    #source: false

    # Bundle Go dependencies into Debian source artifacts by default.
    #source_vendor: true

    #section: misc
    #priority: optional
    #distributions:
    #  - "stable"
    #component: main

    #depends: []
    #recommends: []
    #suggests: []
    #conflicts: []
    #replaces: []

    # Extra files included in the .deb package.
    #files: []
    # Example:
    #files:
    #  - src: packaging/mytool.service
    #    dst: /lib/systemd/system/mytool.service

    # Configuration files registered as dpkg conffiles.
    #conffiles: []

    # Auto-generate maintainer scripts for systemd/sysusers/tmpfiles assets.
    #systemd: true

    # Run lintian on generated .deb packages. Disable if your package has
    # known warnings you accept.
    #lintian: true

    # Explicit maintainer scripts. If any are set, auto-generation is disabled.
    #scripts:
    #  preinst: ""
    #  postinst: ""
    #  prerm: ""
    #  postrm: ""

  rpm:
    # RPM artifacts are disabled by default.
    #enabled: false

    # Source RPM artifacts are disabled by default.
    #source: false

    # Bundle Go dependencies into source RPM artifacts by default.
    #source_vendor: true

    #group: Applications/System
    #vendor: ""
    #repository: ""

    #requires: []
    #provides: []
    #obsoletes: []

  common:
    # Shared package metadata. Empty values are auto-detected where possible.
    #maintainer: ""
    #description: ""
    #homepage: "https://go.schlittermann.de/heiko/cert-proxy"
    #license: ""

  # Multi-package split: omit for one combined package (default),
  # set to '*' for one package per cmd/* binary, or list explicit entries.
  packages: '*'
  #packages:
  #  - name: myapp-server
  #    binaries: [myapp-server]
  #    deb:
  #      depends: []

# Publish step: routes artifact groups to named destinations.
publish:
  # Omitted or "releases" publishes blobs via the Forgejo release API. [] or "none" publishes nowhere.
  #blob: releases

  # Omitted or "packages" publishes Debian artifacts via the Forgejo packages API.
  #deb: packages

  # Omitted or "packages" publishes RPM artifacts via the Forgejo packages API.
  #rpm: packages

  # Destination names are aliases. Built-ins: releases, packages, dupload.
  # Override a built-in or add extra destinations here.
  #destinations:
  #  releases:
  #    type: forgejo-release
  #  packages:
  #    type: forgejo-packages
  #  dupload:
  #    type: dupload
