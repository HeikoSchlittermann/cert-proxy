---
# nagonag scheduled/manual caller for your repo's `.forgejo/workflows/`
# directory.
#
# Scheduled/manual caller.
#
# Without inputs, the reusable workflow scans the triggering commit:
# scheduled runs always fire on the repository's default branch, manual
# runs scan the branch selected in the UI. To scan an explicit branch list
# instead, add `with: scan_branches: '["main", "release/1.x"]'` (a JSON
# array encoded as a string; reusable workflow inputs cannot be YAML lists).

name: nagonag (Scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'

# No `permissions:` block: Forgejo ignores it and warns on every run. The
# default ${{ github.token }} must allow:
#   contents: write       # git push of nagonag/update-<branch>
#   pull-requests: write  # fj pr create
#   issues: write         # fj issue create / comment

jobs:
  nagonag:
    runs-on: nagonag
    uses: ius/workflows/.forgejo/workflows/nagonag.yaml@master
    secrets: inherit
