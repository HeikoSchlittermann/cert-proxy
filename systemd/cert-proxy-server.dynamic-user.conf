#
# Opt-in drop-in for cert-proxy-server.service: run the server as an
# unprivileged, transient (dynamic) user with the supplementary group
# ssl-cert and without any capabilities, instead of as root.
#
# Enable:
#   install -D -m 0644 /usr/share/doc/cert-proxy-server/examples/dynamic-user.conf \
#     /etc/systemd/system/cert-proxy-server.service.d/dynamic-user.conf
#   systemctl daemon-reload && systemctl restart cert-proxy-server
#
# Preconditions -- otherwise the server fails to start or answers 404/500:
#   - /etc/cert-proxy/server-ssl.pem, the /etc/cert-proxy/clients/ directory
#     and the ACME cert store (-certbase, including every per-domain
#     directory) must be readable by group ssl-cert: directories 0750,
#     files 0640, group ssl-cert; their parent directories must be
#     searchable by it.
#   - This must survive ACME renewals, which re-create the files (dehydrated
#     writes them 0600). E.g. a dehydrated deploy_cert hook, or a certbot
#     --deploy-hook, running
#       chgrp -R ssl-cert <certbase> && chmod -R g+rX <certbase>
#   - -serve must use a port >= 1024: no CAP_NET_BIND_SERVICE here.
#
# See cert-proxy-server(8).
[Service]
DynamicUser=yes
SupplementaryGroups=ssl-cert
# Empty: drop all capabilities.
CapabilityBoundingSet=
